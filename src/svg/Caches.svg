<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <title>Generic Frontend / Backend Architecture - Backend L1 / L2 Caches</title>
  <desc>Section 'Backend L1 / L2 Caches' extracted from architecture.svg (group id 'panel-caches'). Colors: blue frontend, purple business logic, green L1 cache, orange Redis, gray infrastructure, teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .psub { font-size: 13px; fill: #94a3b8; font-style: italic; }
      .lbl { font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: 500; }
      .lblb { font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .small { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.45; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .biz { fill: #581c87; fill-opacity: 0.45; stroke: #a855f7; stroke-width: 1.6; rx: 6; }
      .l1 { fill: #14532d; fill-opacity: 0.45; stroke: #22c55e; stroke-width: 1.6; rx: 6; }
      .redis { fill: #7f1d1d; fill-opacity: 0.45; stroke: #dc382d; stroke-width: 1.6; rx: 6; }
      .infra { fill: #334155; fill-opacity: 0.45; stroke: #94a3b8; stroke-width: 1.6; rx: 6; }
      .ops { fill: #134e4a; fill-opacity: 0.45; stroke: #14b8a6; stroke-width: 1.6; rx: 6; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 6; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
      .life { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <g id="section" transform="translate(0,-2400)">
    <g id="panel-caches">
    <text x="50" y="2452" class="ptitle">Backend L1 / L2 Caches (cache-aside read flow)</text>
    <rect x="60" y="2500" width="480" height="290" class="zone" />
    <text x="300" y="2522" class="lblb">Service X — Instance 1</text>
    <rect x="80" y="2545" width="200" height="60" class="biz" /><text x="180" y="2570" class="lbl">Use Case</text><text x="180" y="2588" class="small">read workflow</text>
    <rect x="80" y="2635" width="200" height="60" class="biz" /><text x="180" y="2660" class="lbl">Query Port</text><text x="180" y="2678" class="small">interface</text>
    <path d="M180,2605 L180,2635" class="dep" />
    <rect x="310" y="2545" width="210" height="90" class="infra" />
    <text x="415" y="2570" class="lblb">Cached Query Adapter</text><text x="415" y="2590" class="small">implements Query Port</text><text x="415" y="2608" class="small">coordinates L1, L2, DB</text>
    <path d="M310,2610 L295,2610 L295,2665 L280,2665" class="impl" />
    <rect x="310" y="2670" width="210" height="100" class="l1" />
    <text x="415" y="2695" class="lblb">L1 Cache (Caffeine)</text>
    <text x="415" y="2715" class="small">in-process, per instance</text>
    <text x="415" y="2735" class="small">Short TTL · Bounded Size</text>
    <text x="415" y="2755" class="small">not shared across instances</text>
    <path d="M370,2635 L370,2670" class="sync" /><text x="340" y="2657" class="small" fill="#94a3b8">1 lookup</text>
    <path d="M415,2670 L415,2635" class="sync" /><text x="415" y="2657" class="small" fill="#94a3b8">hit/miss</text>
    <path d="M460,2635 L460,2670" class="sync" /><text x="492" y="2657" class="small" fill="#94a3b8">5 populate</text>
    <rect x="60" y="2810" width="480" height="120" class="zone" />
    <text x="300" y="2832" class="lblb">Service X — Instance 2</text>
    <rect x="80" y="2850" width="210" height="65" class="infra" /><text x="185" y="2877" class="lbl">Cached Query Adapter</text><text x="185" y="2897" class="small">implements Query Port</text>
    <rect x="310" y="2850" width="210" height="65" class="l1" /><text x="415" y="2877" class="lbl">L1 Cache (Caffeine)</text><text x="415" y="2897" class="small">independent from Instance 1 L1</text>
    <path d="M290,2882 L310,2882" class="sync" />
    <rect x="650" y="2550" width="220" height="120" class="redis" />
    <text x="760" y="2578" class="lblb">L2 Cache (Redis)</text>
    <text x="760" y="2600" class="small">shared by all instances</text>
    <text x="760" y="2620" class="small">Configurable TTL</text>
    <text x="760" y="2640" class="small">Keys Namespaced by Service and Tenant</text>
    <text x="760" y="2660" class="small">e.g. svc-x:tenant-42:entity:id</text>
    <rect x="930" y="2550" width="210" height="120" class="infra" />
    <text x="1035" y="2578" class="lblb">Database</text>
    <text x="1035" y="2600" class="small">Source of Truth</text>
    <text x="1035" y="2622" class="small">owned by Service X</text>
    <text x="1035" y="2650" class="small" fill="#f87171">Redis never queries the DB</text>
    <path d="M520,2560 L650,2560" class="sync" />
    <text x="585" y="2538" class="small" fill="#94a3b8">2 L1 miss → L2 GET</text>
    <path d="M520,2625 L650,2625" class="sync" />
    <text x="585" y="2650" class="small" fill="#94a3b8">4 populate L2 (SET, TTL)</text>
    <path d="M520,2600 L565,2600 L565,2695 L1035,2695 L1035,2670" class="sync" />
    <text x="800" y="2716" class="small" fill="#94a3b8">3 L2 miss → Database query (then 4, then 5)</text>
    <text x="800" y="2736" class="small" fill="#94a3b8">Redis hit → skip 3 and 4, populate L1 only (5)</text>
    <path d="M290,2905 L610,2905 L610,2760 L760,2760 L760,2670" class="sync" />
    <text x="630" y="2785" class="note" font-size="11">Instance 2 runs the same cache-aside flow against the same Redis cluster</text>
    <text x="630" y="2800" class="note" font-size="11">and the same Database; its L1 is independent.</text>
  </g>
  </g>
</svg>
