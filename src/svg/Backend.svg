<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <title>Generic Frontend / Backend Architecture - Backend - Microservices</title>
  <desc>Section 'Backend - Microservices' extracted from architecture.svg (group id 'panel-backend'). Colors: blue frontend, purple business logic, green L1 cache, orange Redis, gray infrastructure, teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .psub { font-size: 13px; fill: #94a3b8; font-style: italic; }
      .lbl { font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: 500; }
      .lblb { font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .small { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.45; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .biz { fill: #581c87; fill-opacity: 0.45; stroke: #a855f7; stroke-width: 1.6; rx: 6; }
      .l1 { fill: #14532d; fill-opacity: 0.45; stroke: #22c55e; stroke-width: 1.6; rx: 6; }
      .redis { fill: #7f1d1d; fill-opacity: 0.45; stroke: #dc382d; stroke-width: 1.6; rx: 6; }
      .infra { fill: #334155; fill-opacity: 0.45; stroke: #94a3b8; stroke-width: 1.6; rx: 6; }
      .ops { fill: #134e4a; fill-opacity: 0.45; stroke: #14b8a6; stroke-width: 1.6; rx: 6; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 6; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
      .life { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <g id="section" transform="translate(0,-1120)">
  <g id="panel-backend">
  <text x="50" y="1172" class="ptitle">Backend — Microservices</text>
    <rect x="70" y="1220" width="220" height="60" class="fe" />
    <text x="180" y="1245" class="lblb">Browser</text><text x="180" y="1265" class="small">Shell + any micro-frontend</text>
    <rect x="420" y="1220" width="220" height="60" class="infra" />
    <text x="530" y="1245" class="lblb">Reverse Proxy</text><text x="530" y="1265" class="small">TLS, static assets, routing</text>
    <rect x="770" y="1220" width="220" height="60" class="infra" />
    <text x="880" y="1245" class="lblb">API Gateway</text><text x="880" y="1265" class="small">authN/authZ, rate limiting, routing</text>
    <path d="M290,1250 L420,1250" class="sync" /><text x="355" y="1242" class="small" fill="#94a3b8">HTTPS</text>
    <path d="M640,1250 L770,1250" class="sync" /><text x="705" y="1242" class="small" fill="#94a3b8">HTTP</text>
    <rect x="80" y="1380" width="280" height="140" class="zone" />
    <rect x="100" y="1395" width="240" height="50" class="biz" /><text x="220" y="1425" class="lblb">Service A</text>
    <rect x="100" y="1460" width="240" height="48" class="infra" /><text x="220" y="1480" class="lbl">Database A</text><text x="220" y="1498" class="small">(private schema)</text>
    <rect x="460" y="1380" width="280" height="140" class="zone" />
    <rect x="480" y="1395" width="240" height="50" class="biz" /><text x="600" y="1425" class="lblb">Service B</text>
    <rect x="480" y="1460" width="240" height="48" class="infra" /><text x="600" y="1480" class="lbl">Database B</text><text x="600" y="1498" class="small">(private schema)</text>
    <rect x="840" y="1380" width="280" height="140" class="zone" />
    <rect x="860" y="1395" width="240" height="50" class="biz" /><text x="980" y="1425" class="lblb">Service C</text>
    <rect x="860" y="1460" width="240" height="48" class="infra" /><text x="980" y="1480" class="lbl">Database C</text><text x="980" y="1498" class="small">(private schema)</text>
    <path d="M880,1280 L880,1330 L220,1330 L220,1395" class="sync" />
    <path d="M880,1330 L600,1330 L600,1395" class="sync" />
    <path d="M880,1330 L980,1330 L980,1395" class="sync" />
    <text x="400" y="1322" class="small" fill="#94a3b8">Gateway routes to N services (one screen may call several services)</text>
    <path d="M340,1410 L480,1410" class="sync" /><text x="410" y="1402" class="small" fill="#94a3b8">sync HTTP</text>
    <line x1="340" y1="1484" x2="480" y2="1484" class="forbid" /><line x1="403" y1="1472" x2="417" y2="1496" stroke="#ef4444" stroke-width="2.5" />
    <text x="410" y="1540" class="small" fill="#f87171">No cross-service DB access</text>
    <rect x="80" y="1610" width="1040" height="60" class="infra" />
    <text x="600" y="1636" class="lblb">Message Broker</text>
    <text x="600" y="1656" class="small">topics / queues · at-least-once delivery · consumers must be idempotent</text>
    <path d="M180,1520 L180,1610" class="async" /><text x="150" y="1570" class="small" fill="#fb923c">publish</text>
    <path d="M600,1610 L600,1520" class="async" /><text x="635" y="1570" class="small" fill="#fb923c">subscribe</text>
    <path d="M980,1610 L980,1520" class="async" /><text x="1015" y="1570" class="small" fill="#fb923c">subscribe</text>
  </g>
  </g>
  </svg>
