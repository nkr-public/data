<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <title>Generic Frontend / Backend Architecture - Hexagonal Architecture inside a Microservice</title>
  <desc>Section 'Hexagonal Architecture inside a Microservice' extracted from architecture.svg (group id 'panel-hexagonal'). Colors: blue frontend, purple business logic, green L1 cache, orange Redis, gray infrastructure, teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .psub { font-size: 13px; fill: #94a3b8; font-style: italic; }
      .lbl { font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: 500; }
      .lblb { font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .small { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.45; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .biz { fill: #581c87; fill-opacity: 0.45; stroke: #a855f7; stroke-width: 1.6; rx: 6; }
      .l1 { fill: #14532d; fill-opacity: 0.45; stroke: #22c55e; stroke-width: 1.6; rx: 6; }
      .redis { fill: #7f1d1d; fill-opacity: 0.45; stroke: #dc382d; stroke-width: 1.6; rx: 6; }
      .infra { fill: #334155; fill-opacity: 0.45; stroke: #94a3b8; stroke-width: 1.6; rx: 6; }
      .ops { fill: #134e4a; fill-opacity: 0.45; stroke: #14b8a6; stroke-width: 1.6; rx: 6; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 6; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
      .life { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <g id="section" transform="translate(0,-1740)">
    <g id="panel-hexagonal">
    <text x="50" y="1792" class="ptitle">Hexagonal Architecture inside a Microservice</text>
    <rect x="50" y="1840" width="230" height="360" class="zone" />
    <text x="165" y="1862" class="lblb">Inbound Adapters</text>
    <rect x="65" y="1885" width="200" height="60" class="infra" /><text x="165" y="1910" class="lbl">REST Controller</text><text x="165" y="1928" class="small">HTTP, JSON, validation</text>
    <rect x="65" y="1985" width="200" height="60" class="infra" /><text x="165" y="2010" class="lbl">Message Consumer</text><text x="165" y="2028" class="small">Kafka listener / consumer</text>
    <rect x="65" y="2085" width="200" height="60" class="infra" /><text x="165" y="2110" class="lbl">Scheduled Job</text><text x="165" y="2128" class="small">cron, background trigger</text>
    <rect x="310" y="1840" width="560" height="360" class="zone" />
    <text x="590" y="1862" class="lblb">Application</text>
    <rect x="325" y="1960" width="110" height="120" class="biz" /><text x="380" y="2012" class="lblb">Inbound</text><text x="380" y="2032" class="lblb">Ports</text><text x="380" y="2052" class="small">interfaces</text>
    <rect x="480" y="1890" width="220" height="260" class="biz" />
    <text x="590" y="1915" class="lblb">Use Cases</text>
    <text x="590" y="1933" class="small">application services, transactions</text>
    <rect x="495" y="1955" width="190" height="175" fill="#3b0764" fill-opacity="0.5" stroke="#c084fc" stroke-width="1.6" rx="6" />
    <text x="590" y="1980" class="lblb">Domain</text>
    <text x="590" y="2002" class="small">Entities · Value Objects</text>
    <text x="590" y="2020" class="small">Business Rules · Domain Events</text>
    <text x="590" y="2050" class="small" fill="#f87171">No framework / infrastructure</text>
    <text x="590" y="2065" class="small" fill="#f87171">dependencies</text>
    <text x="590" y="2090" class="small">pure language constructs only</text>
    <rect x="745" y="1960" width="110" height="120" class="biz" /><text x="800" y="2012" class="lblb">Outbound</text><text x="800" y="2032" class="lblb">Ports</text><text x="800" y="2052" class="small">interfaces</text>
    <path d="M480,2020 L435,2020" class="impl" /><text x="457" y="2010" class="small" fill="#cbd5e1">impl</text>
    <path d="M700,2020 L745,2020" class="dep" /><text x="722" y="2010" class="small" fill="#cbd5e1">uses</text>
    <path d="M265,1915 L290,1915 L290,1985 L325,1985" class="dep" />
    <path d="M265,2015 L325,2015" class="dep" />
    <path d="M265,2115 L290,2115 L290,2050 L325,2050" class="dep" />
    <text x="380" y="2180" class="small" fill="#94a3b8">adapters call inbound ports</text>
    <rect x="900" y="1840" width="250" height="360" class="zone" />
    <text x="1025" y="1862" class="lblb">Outbound Adapters</text>
    <rect x="915" y="1885" width="220" height="50" class="infra" /><text x="1025" y="1905" class="lbl">Persistence Adapter</text><text x="1025" y="1923" class="small">SQL / ORM / DynamoDB / Redis</text>
    <rect x="915" y="1950" width="220" height="50" class="infra" /><text x="1025" y="1970" class="lbl">HTTP Client Adapter</text><text x="1025" y="1988" class="small">partner APIs / 3rd parties</text>
    <rect x="915" y="2015" width="220" height="50" class="l1" /><text x="1025" y="2035" class="lbl">Cache Adapter</text><text x="1025" y="2053" class="small">L1 in-memory + L2 Redis</text>
    <rect x="915" y="2080" width="220" height="50" class="infra" /><text x="1025" y="2100" class="lbl">Event Publisher Adapter</text><text x="1025" y="2118" class="small">Kafka / RabbitMQ publisher</text>
    <path d="M915,1910 L885,1910 L885,1990 L855,1990" class="impl" />
    <path d="M915,1975 L885,1975 L885,2010 L855,2010" class="impl" />
    <path d="M915,2040 L885,2040 L885,2030 L855,2030" class="impl" />
    <path d="M915,2105 L885,2105 L885,2050 L855,2050" class="impl" />
    <text x="1025" y="2160" class="small" fill="#94a3b8">Outbound Adapters implement</text><text x="1025" y="2175" class="small" fill="#94a3b8">Outbound Port interfaces</text>
    <rect x="50" y="2225" width="820" height="50" class="infra" />
    <text x="460" y="2246" class="lblb">Bootstrap</text>
    <text x="460" y="2264" class="small">Configuration · Dependency Injection — wires adapters to ports; depends on all modules</text>
    <rect x="900" y="2225" width="250" height="50" class="infra" />
    <text x="1025" y="2246" class="lbl">External systems (runtime)</text><text x="1025" y="2264" class="small">DB, Redis, Broker, HTTP APIs</text>
    <path d="M1000,2130 L1000,2225" class="sync" />
    <path d="M1060,2130 L1060,2225" class="async" />
  </g>
  </g>
</svg>
