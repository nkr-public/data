<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <title>Architecture Legend - Dark Theme v2</title>
  <desc>Section 'Legend' adapted for dark theme and application design system. Colors: Redis accent, Blue frontend, Purple business logic, Green L1 cache, Slate infrastructure, Teal DevOps.</desc>
  <defs>
    <!-- Background Gradient matching app surface -->
    <linearGradient id="panelBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>

    <!-- Redis Accent Badge Gradient -->
    <linearGradient id="badgeRedis" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc382d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#dc382d" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-dep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arrow-impl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6"/>
    </marker>
    <marker id="arrow-pipe" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <style>
    .legend-title { font-weight: 700; font-size: 15px; fill: #f8fafc; letter-spacing: -0.01em; }
    .legend-tag { font-weight: 700; font-size: 10px; fill: #f87171; letter-spacing: 0.08em; }
    .legend-text { font-size: 12px; fill: #cbd5e1; font-weight: 400; }
    .legend-sub { font-size: 11px; fill: #94a3b8; }
    .legend-node { font-size: 12px; font-weight: 500; }
  </style>

  <!-- Left: Legend Header -->
  <g id="legend-header">
    <rect x="42" y="28" width="68" height="20" rx="5" ry="5" fill="url(#badgeRedis)" stroke="#dc382d" stroke-width="1" stroke-opacity="0.45"/>
    <text x="52" y="42" class="legend-tag">LÉGENDE</text>
    <text x="42" y="74" class="legend-title">Flux &amp; Nœuds</text>
    <text x="42" y="93" font-size="11" fill="#64748b">Architecture globale</text>
  </g>

  <!-- Flow 1: Synchronous Call -->
  <g id="flow-sync">
    <line x1="175" y1="48" x2="235" y2="48" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrow-sync)"/>
    <text x="248" y="52" class="legend-text">Appel synchrone <tspan class="legend-sub">(HTTP / runtime)</tspan></text>
  </g>

  <!-- Flow 2: Asynchronous Event -->
  <g id="flow-async">
    <line x1="175" y1="88" x2="235" y2="88" stroke="#fb923c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-async)"/>
    <text x="248" y="92" class="legend-text">Événement async <tspan class="legend-sub">(Broker / runtime)</tspan></text>
  </g>

  <!-- Flow 3: Code Dependency -->
  <g id="flow-dep">
    <line x1="435" y1="48" x2="495" y2="48" stroke="#c084fc" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-dep)"/>
    <text x="508" y="52" class="legend-text">Dépendance de code <tspan class="legend-sub">(dépend de)</tspan></text>
  </g>

  <!-- Flow 4: Interface Implementation -->
  <g id="flow-impl">
    <line x1="435" y1="88" x2="495" y2="88" stroke="#c084fc" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-impl)"/>
    <text x="508" y="92" class="legend-text">Implémentation d'interface</text>
  </g>

  <!-- Flow 5: Pipeline Step -->
  <g id="flow-pipe">
    <line x1="685" y1="48" x2="745" y2="48" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-pipe)"/>
    <text x="758" y="52" class="legend-text">Étape pipeline <tspan class="legend-sub">(CI/CD)</tspan></text>
  </g>

  <!-- Flow 6: Forbidden Flow -->
  <g id="flow-forbidden">
    <g transform="translate(685, 88)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#f87171" stroke-width="2"/>
      <line x1="26" y1="-8" x2="34" y2="8" stroke="#ef4444" stroke-width="2.5"/>
    </g>
    <text x="758" y="92" class="legend-text" fill="#f87171">Flux interdit / Bloqué</text>
  </g>

  <!-- Node Types: 2 columns on right side -->
  <!-- Col 1 (x: 910) -->
  <!-- Frontend -->
  <g id="node-frontend">
    <rect x="910" y="34" width="22" height="18" rx="4" ry="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="940" y="48" class="legend-node" fill="#93c5fd">Frontend</text>
  </g>
  <!-- Business Logic -->
  <g id="node-business">
    <rect x="910" y="62" width="22" height="18" rx="4" ry="4" fill="#581c87" fill-opacity="0.4" stroke="#a855f7" stroke-width="1.6"/>
    <text x="940" y="76" class="legend-node" fill="#d8b4fe">Business logic</text>
  </g>
  <!-- L1 Cache -->
  <g id="node-l1">
    <rect x="910" y="90" width="22" height="18" rx="4" ry="4" fill="#14532d" fill-opacity="0.4" stroke="#22c55e" stroke-width="1.6"/>
    <text x="940" y="104" class="legend-node" fill="#86efac">L1 cache</text>
  </g>

  <!-- Col 2 (x: 1045) -->
  <!-- Redis (L2) -->
  <g id="node-redis">
    <rect x="1045" y="34" width="22" height="18" rx="4" ry="4" fill="#7f1d1d" fill-opacity="0.4" stroke="#dc382d" stroke-width="1.6"/>
    <text x="1075" y="48" class="legend-node" fill="#fca5a5">Redis (L2)</text>
  </g>
  <!-- Infrastructure -->
  <g id="node-infra">
    <rect x="1045" y="62" width="22" height="18" rx="4" ry="4" fill="#334155" fill-opacity="0.4" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="1075" y="76" class="legend-node" fill="#cbd5e1">Infrastructure</text>
  </g>
  <!-- DevOps / CI-CD -->
  <g id="node-devops">
    <rect x="1045" y="90" width="22" height="18" rx="4" ry="4" fill="#134e4a" fill-opacity="0.4" stroke="#14b8a6" stroke-width="1.6"/>
    <text x="1075" y="104" class="legend-node" fill="#5eead4">DevOps / CI-CD</text>
  </g>
</svg>
