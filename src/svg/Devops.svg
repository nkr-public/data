<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <title>Generic Frontend / Backend Architecture - DevOps Architecture - CI/CD and Platform</title>
  <desc>Section 'DevOps Architecture - CI/CD and Platform' extracted from architecture.svg (group id 'panel-devops'). Colors: blue frontend, purple business logic, green L1 cache, orange Redis, gray infrastructure, teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .psub { font-size: 13px; fill: #94a3b8; font-style: italic; }
      .lbl { font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: 500; }
      .lblb { font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .small { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.45; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .biz { fill: #581c87; fill-opacity: 0.45; stroke: #a855f7; stroke-width: 1.6; rx: 6; }
      .l1 { fill: #14532d; fill-opacity: 0.45; stroke: #22c55e; stroke-width: 1.6; rx: 6; }
      .redis { fill: #7f1d1d; fill-opacity: 0.45; stroke: #dc382d; stroke-width: 1.6; rx: 6; }
      .infra { fill: #334155; fill-opacity: 0.45; stroke: #94a3b8; stroke-width: 1.6; rx: 6; }
      .ops { fill: #134e4a; fill-opacity: 0.45; stroke: #14b8a6; stroke-width: 1.6; rx: 6; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 6; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
      .life { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <g id="section" transform="translate(0,-4160)">
    <g id="panel-devops">
    <text x="50" y="4212" class="ptitle">DevOps Architecture — CI / CD &amp; Platform</text>
    <rect x="50" y="4260" width="1100" height="230" class="zone" />
    <text x="70" y="4280" class="note" font-weight="bold" fill="#f8fafc">Continuous Integration (per repository / per deployment unit)</text>
    <rect x="70" y="4300" width="170" height="80" class="ops" />
    <text x="155" y="4324" class="lblb">Source Control</text>
    <text x="155" y="4342" class="small">Git · trunk-based · PRs</text>
    <text x="155" y="4357" class="small">frontend monorepo</text>
    <text x="155" y="4371" class="small">one repo / microservice</text>
    <rect x="280" y="4300" width="170" height="80" class="ops" />
    <text x="365" y="4324" class="lblb">Build &amp; Unit Tests</text>
    <text x="365" y="4342" class="small">Vite / Maven / Gradle</text>
    <text x="365" y="4357" class="small">lint · type-check · tests</text>
    <text x="365" y="4371" class="small">dep-cruiser · ArchUnit</text>
    <rect x="490" y="4300" width="170" height="80" class="ops" />
    <text x="575" y="4324" class="lblb">Quality &amp; Security</text>
    <text x="575" y="4342" class="small">SAST · license scan</text>
    <text x="575" y="4357" class="small">container image scan · SBOM</text>
    <text x="575" y="4371" class="small">quality gate &amp; coverage</text>
    <rect x="700" y="4300" width="170" height="80" class="ops" />
    <text x="785" y="4324" class="lblb">Integration Tests</text>
    <text x="785" y="4342" class="small">api-contracts tests</text>
    <text x="785" y="4357" class="small">consumer-driven</text>
    <text x="785" y="4371" class="small">Testcontainers (DB/Redis)</text>
    <rect x="910" y="4300" width="220" height="80" class="ops" />
    <text x="1020" y="4324" class="lblb">Publish Artifacts</text>
    <text x="1020" y="4342" class="small">immutable, versioned, signed</text>
    <text x="1020" y="4357" class="small">image tag = git SHA</text>
    <text x="1020" y="4371" class="small">no rebuild between envs</text>
    <path d="M240,4340 L280,4340" class="pipe" />
    <path d="M450,4340 L490,4340" class="pipe" />
    <path d="M660,4340 L700,4340" class="pipe" />
    <path d="M870,4340 L910,4340" class="pipe" />
    <rect x="70" y="4410" width="250" height="60" class="infra" />
    <text x="195" y="4433" class="lbl">Container Registry</text><text x="195" y="4452" class="small">microservice OCI images (signed)</text>
    <rect x="350" y="4410" width="250" height="60" class="infra" />
    <text x="475" y="4433" class="lbl">Static Assets / CDN Bucket</text><text x="475" y="4452" class="small">remoteEntry.js, JS/CSS bundles</text>
    <rect x="630" y="4410" width="250" height="60" class="infra" />
    <text x="755" y="4433" class="lbl">Package Registry</text><text x="755" y="4452" class="small">shared npm / maven packages</text>
    <rect x="910" y="4410" width="220" height="60" class="infra" />
    <text x="1020" y="4433" class="lbl">Manifests Repo</text><text x="1020" y="4452" class="small">Helm / Kustomize / GitOps</text>
    <path d="M960,4380 L960,4395 L195,4395 L195,4410" class="pipe" />
    <path d="M990,4380 L990,4395 L475,4395 L475,4410" class="pipe" />
    <path d="M1020,4380 L1020,4395 L755,4395 L755,4410" class="pipe" />
    <path d="M1060,4380 L1060,4410" class="pipe" />
    <rect x="50" y="4510" width="1100" height="240" class="zone" />
    <text x="300" y="4530" class="note" font-weight="bold" fill="#f8fafc">Continuous Delivery / Deployment (GitOps, promotion through environments)</text>
    <rect x="70" y="4550" width="200" height="80" class="ops" />
    <text x="170" y="4575" class="lblb">GitOps Controller</text>
    <text x="170" y="4593" class="small">reconciles cluster with manifests repo</text>
    <text x="170" y="4608" class="small">pull-based · drift detection</text>
    <text x="170" y="4622" class="small">rollback = git revert</text>
    <rect x="310" y="4550" width="170" height="80" class="infra" />
    <text x="395" y="4580" class="lblb">Dev</text><text x="395" y="4598" class="small">auto-deploy on merge</text><text x="395" y="4614" class="small">ephemeral review apps</text>
    <rect x="520" y="4550" width="170" height="80" class="infra" />
    <text x="605" y="4580" class="lblb">Staging</text><text x="605" y="4598" class="small">E2E · smoke · perf tests</text><text x="605" y="4614" class="small">prod-like config</text>
    <rect x="730" y="4550" width="200" height="80" class="infra" />
    <text x="830" y="4580" class="lblb">Production</text><text x="830" y="4598" class="small">canary / blue-green rollout</text><text x="830" y="4614" class="small">automated rollback on SLI breach</text>
    <rect x="960" y="4550" width="170" height="80" class="ops" />
    <text x="1045" y="4575" class="lblb">Observability</text>
    <text x="1045" y="4593" class="small">logs · metrics · traces</text>
    <text x="1045" y="4608" class="small">OpenTelemetry · alerts</text>
    <text x="1045" y="4622" class="small">dashboards &amp; SLO tracking</text>
    <path d="M270,4590 L310,4590" class="pipe" />
    <path d="M480,4590 L520,4590" class="pipe" /><text x="500" y="4582" class="small" fill="#2dd4bf">promote</text>
    <path d="M690,4590 L730,4590" class="pipe" /><text x="710" y="4582" class="small" fill="#2dd4bf">promote</text>
    <path d="M930,4590 L960,4590" class="pipe" />
    <path d="M1045,4630 L1045,4660 L170,4660 L170,4630" class="async" />
    <text x="600" y="4652" class="small" fill="#fb923c">feedback: alert / rollback / metrics</text>
    <path d="M1060,4470 L1060,4495 L170,4495 L170,4550" class="pipe" />
    <rect x="50" y="4770" width="1100" height="150" class="zone" />
    <text x="70" y="4790" class="note" font-weight="bold" fill="#f8fafc">Platform layer (Infrastructure as Code)</text>
    <rect x="70" y="4805" width="200" height="90" class="infra" />
    <text x="170" y="4830" class="lblb">Kubernetes Cluster</text><text x="170" y="4848" class="small">namespaces per env</text><text x="170" y="4863" class="small">HPA · Ingress · NetworkPolicies</text><text x="170" y="4878" class="small">service mesh (mTLS)</text>
    <rect x="290" y="4805" width="200" height="90" class="infra" />
    <text x="390" y="4830" class="lblb">Infrastructure as Code</text><text x="390" y="4848" class="small">Terraform / OpenTofu</text><text x="390" y="4863" class="small">modules versioned</text><text x="390" y="4878" class="small">state locked in S3/DynamoDB</text>
    <rect x="510" y="4805" width="200" height="90" class="infra" />
    <text x="610" y="4830" class="lblb">Secrets &amp; Config</text><text x="610" y="4848" class="small">Vault / KMS</text><text x="610" y="4863" class="small">External Secrets Operator</text><text x="610" y="4878" class="small">no plain text in Git</text>
    <rect x="730" y="4805" width="200" height="90" class="infra" />
    <text x="830" y="4830" class="lblb">Identity &amp; Access</text><text x="830" y="4848" class="small">OIDC / IAM roles for SAs</text><text x="830" y="4863" class="small">least privilege</text><text x="830" y="4878" class="small">automated token rotation</text>
    <rect x="950" y="4805" width="180" height="90" class="infra" />
    <text x="1040" y="4830" class="lblb">Cost &amp; Governance</text><text x="1040" y="4848" class="small">resource requests / limits</text><text x="1040" y="4863" class="small">FinOps tags · auto-scaling</text><text x="1040" y="4878" class="small">policy as code (OPA/Kyverno)</text>
  </g>
  </g>
</svg>
