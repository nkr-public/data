<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <title>Architecture Legend - Dark Theme</title>
  <desc>Section 'Legend' adapted for dark theme and application design. Colors: Redis accent, Blue frontend, Purple business logic, Green L1 cache, Slate infrastructure, Teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 14px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.4; stroke: #3b82f6; stroke-width: 1.6; rx: 3; }
      .biz { fill: #581c87; fill-opacity: 0.4; stroke: #a855f7; stroke-width: 1.6; rx: 3; }
      .l1 { fill: #14532d; fill-opacity: 0.4; stroke: #22c55e; stroke-width: 1.6; rx: 3; }
      .redis { fill: #7f1d1d; fill-opacity: 0.4; stroke: #dc382d; stroke-width: 1.6; rx: 3; }
      .infra { fill: #334155; fill-opacity: 0.4; stroke: #94a3b8; stroke-width: 1.6; rx: 3; }
      .ops { fill: #134e4a; fill-opacity: 0.4; stroke: #14b8a6; stroke-width: 1.6; rx: 3; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <g id="legend">
    <text x="48" y="44" class="ptitle">Legend</text>
    <rect x="48" y="50" width="24" height="2" rx="1" fill="#dc382d" />
    <line x1="48" y1="78" x2="110" y2="78" class="sync" /><text x="125" y="82" class="note">Synchronous call (HTTP, runtime)</text>
    <line x1="48" y1="106" x2="110" y2="106" class="async" /><text x="125" y="110" class="note">Asynchronous event / message (runtime)</text>
    <line x1="375" y1="78" x2="437" y2="78" class="dep" /><text x="452" y="82" class="note">Code dependency (depends on)</text>
    <line x1="375" y1="106" x2="437" y2="106" class="impl" /><text x="452" y="110" class="note">Interface implementation</text>
    <line x1="675" y1="78" x2="737" y2="78" class="pipe" /><text x="752" y="82" class="note">Pipeline stage / deployment step</text>
    <g transform="translate(675, 106)">
      <line x1="0" y1="0" x2="40" y2="0" class="forbid" />
      <line x1="16" y1="-7" x2="22" y2="7" stroke="#ef4444" stroke-width="2.5" />
    </g>
    <text x="752" y="110" class="note" fill="#f87171">Forbidden</text>
    <rect x="955" y="32" width="18" height="14" class="fe" /><text x="982" y="44" class="note" fill="#93c5fd">Frontend</text>
    <rect x="955" y="58" width="18" height="14" class="biz" /><text x="982" y="70" class="note" fill="#d8b4fe">Business logic</text>
    <rect x="955" y="84" width="18" height="14" class="l1" /><text x="982" y="96" class="note" fill="#86efac">L1 cache</text>
    <rect x="1075" y="32" width="18" height="14" class="redis" /><text x="1102" y="44" class="note" fill="#fca5a5">Redis (L2)</text>
    <rect x="1075" y="58" width="18" height="14" class="infra" /><text x="1102" y="70" class="note" fill="#cbd5e1">Infrastructure</text>
    <rect x="1075" y="84" width="18" height="14" class="ops" /><text x="1102" y="96" class="note" fill="#5eead4">DevOps / CI-CD</text>
  </g>
</svg>
