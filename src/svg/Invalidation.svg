<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <title>Generic Frontend / Backend Architecture - Writes and Cache Invalidation</title>
  <desc>Section 'Writes and Cache Invalidation' extracted from architecture.svg (group id 'panel-invalidation'). Colors: blue frontend, purple business logic, green L1 cache, orange Redis, gray infrastructure, teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .psub { font-size: 13px; fill: #94a3b8; font-style: italic; }
      .lbl { font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: 500; }
      .lblb { font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .small { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.45; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .biz { fill: #581c87; fill-opacity: 0.45; stroke: #a855f7; stroke-width: 1.6; rx: 6; }
      .l1 { fill: #14532d; fill-opacity: 0.45; stroke: #22c55e; stroke-width: 1.6; rx: 6; }
      .redis { fill: #7f1d1d; fill-opacity: 0.45; stroke: #dc382d; stroke-width: 1.6; rx: 6; }
      .infra { fill: #334155; fill-opacity: 0.45; stroke: #94a3b8; stroke-width: 1.6; rx: 6; }
      .ops { fill: #134e4a; fill-opacity: 0.45; stroke: #14b8a6; stroke-width: 1.6; rx: 6; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 6; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
      .life { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <g id="section" transform="translate(0,-2980)">
    <g id="panel-invalidation">
    <text x="50" y="3032" class="ptitle">Writes &amp; Cache Invalidation — Sequence (Eventual Consistency)</text>
    <rect x="60" y="3080" width="180" height="44" class="biz" /><text x="150" y="3107" class="lblb">Instance 1 (Writer)</text>
    <rect x="300" y="3080" width="180" height="44" class="infra" /><text x="390" y="3107" class="lblb">Database + Outbox</text>
    <rect x="540" y="3080" width="160" height="44" class="infra" /><text x="620" y="3107" class="lblb">Outbox Processor</text>
    <rect x="760" y="3080" width="180" height="44" class="redis" /><text x="850" y="3107" class="lblb">Redis Cluster</text>
    <rect x="990" y="3080" width="160" height="44" class="biz" /><text x="1070" y="3107" class="lblb">Instance 2 (Reader)</text>
    <line x1="150" y1="3124" x2="150" y2="3480" class="life" />
    <line x1="390" y1="3124" x2="390" y2="3480" class="life" />
    <line x1="620" y1="3124" x2="620" y2="3480" class="life" />
    <line x1="850" y1="3124" x2="850" y2="3480" class="life" />
    <line x1="1070" y1="3124" x2="1070" y2="3480" class="life" />
    <path d="M150,3160 L390,3160" class="sync" />
    <text x="270" y="3152" class="small" fill="#94a3b8">a. BEGIN TX: write data + insert invalidation event (outbox row)</text>
    <path d="M150,3200 L390,3200" class="sync" />
    <text x="270" y="3192" class="small" fill="#94a3b8">b. COMMIT (data and event atomically durable)</text>
    <path d="M150,3240 L120,3240 L120,3262 L150,3262" class="sync" />
    <rect x="165" y="3242" width="150" height="22" class="l1" /><text x="240" y="3257" class="small" fill="#86efac">c. evict own L1</text>
    <path d="M620,3300 L390,3300" class="sync" />
    <text x="505" y="3292" class="small" fill="#94a3b8">d. poll / tail committed outbox events</text>
    <path d="M620,3340 L850,3340" class="sync" />
    <text x="735" y="3332" class="small" fill="#94a3b8">e. DEL L2 key (svc:tenant:entity:id)</text>
    <path d="M620,3380 L850,3380" class="async" />
    <text x="735" y="3372" class="small" fill="#fb923c">f. PUBLISH L1-invalidation notification</text>
    <path d="M850,3420 L1070,3420" class="async" />
    <text x="960" y="3412" class="small" fill="#fb923c">f'. Pub/Sub fan-out to all subscribed instances</text>
    <path d="M1070,3450 L1100,3450 L1100,3472 L1070,3472" class="sync" />
    <rect x="900" y="3452" width="160" height="22" class="l1" /><text x="980" y="3467" class="small" fill="#86efac">g. evict own L1</text>
  </g>
  </g>
</svg>
