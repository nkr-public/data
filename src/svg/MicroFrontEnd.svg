<?xml version="1.0" encoding="utf-8"?>
<svg font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <title>Generic Frontend / Backend Architecture - Frontend - Micro-frontends and Shared Packages</title>
  <desc>Section 'Frontend - Micro-frontends and Shared Packages' extracted from architecture.svg (group id 'panel-frontend'). Colors: blue frontend, purple business logic, green L1 cache, orange Redis, gray infrastructure, teal DevOps.</desc>
  <defs>
    <linearGradient id="panelBgDarkMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
    <marker id="arrowSync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb923c" />
    </marker>
    <marker id="arrowDep" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowImpl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 1.5, 8 5, 0 8.5" fill="#161b22" stroke="#c084fc" stroke-width="1.6" />
    </marker>
    <marker id="arrowOps" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf" />
    </marker>
    <style>
      .panel { fill: url(#panelBgDarkMain); stroke: #30363d; stroke-width: 1.2; rx: 12; }
      .ptitle { font-size: 20px; font-weight: 700; fill: #f8fafc; letter-spacing: -0.01em; }
      .psub { font-size: 13px; fill: #94a3b8; font-style: italic; }
      .lbl { font-size: 14px; fill: #f8fafc; text-anchor: middle; font-weight: 500; }
      .lblb { font-size: 15px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .small { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .note { font-size: 12px; fill: #cbd5e1; }
      .fe { fill: #1e3a8a; fill-opacity: 0.45; stroke: #3b82f6; stroke-width: 1.6; rx: 6; }
      .biz { fill: #581c87; fill-opacity: 0.45; stroke: #a855f7; stroke-width: 1.6; rx: 6; }
      .l1 { fill: #14532d; fill-opacity: 0.45; stroke: #22c55e; stroke-width: 1.6; rx: 6; }
      .redis { fill: #7f1d1d; fill-opacity: 0.45; stroke: #dc382d; stroke-width: 1.6; rx: 6; }
      .infra { fill: #334155; fill-opacity: 0.45; stroke: #94a3b8; stroke-width: 1.6; rx: 6; }
      .ops { fill: #134e4a; fill-opacity: 0.45; stroke: #14b8a6; stroke-width: 1.6; rx: 6; }
      .zone { fill: none; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 6 4; rx: 6; }
      .sync { stroke: #f8fafc; stroke-width: 2; fill: none; marker-end: url(#arrowSync); }
      .async { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrowAsync); }
      .dep { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrowDep); }
      .impl { stroke: #c084fc; stroke-width: 2; fill: none; stroke-dasharray: 8 4; marker-end: url(#arrowImpl); }
      .pipe { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#arrowOps); }
      .forbid { stroke: #f87171; stroke-width: 2; fill: none; }
      .life { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>
  <g id="section" transform="translate(0,-190)">
    <g id="panel-frontend">
    <text x="50" y="242" class="ptitle">Frontend — Micro-frontends &amp; Shared Packages</text>
    <rect x="70" y="285" width="1060" height="60" class="fe" />
    <text x="600" y="310" class="lblb">Shell (host)</text>
    <text x="600" y="330" class="small">Navigation, routing, runtime composition of independently built &amp; deployed micro-frontends</text>
    <rect x="110" y="400" width="240" height="56" class="fe" /><text x="230" y="433" class="lblb">Application A</text>
    <rect x="480" y="400" width="240" height="56" class="fe" /><text x="600" y="433" class="lblb">Application B</text>
    <rect x="850" y="400" width="240" height="56" class="fe" /><text x="970" y="433" class="lblb">Application C</text>
    <path d="M230,345 L230,400" class="dep" />
    <path d="M600,345 L600,400" class="dep" />
    <path d="M970,345 L970,400" class="dep" />
    <text x="600" y="378" class="small">Shell loads remotes at runtime (composition)</text>
    <line x1="350" y1="428" x2="480" y2="428" class="forbid" /><line x1="408" y1="416" x2="422" y2="440" class="forbid" />
    <line x1="720" y1="428" x2="850" y2="428" class="forbid" /><line x1="778" y1="416" x2="792" y2="440" class="forbid" />
    <text x="415" y="478" class="small" fill="#dc2626">Micro-frontends must NOT import each other</text>
    <text x="785" y="478" class="small">Applications depend on shared packages</text>
    <rect x="70" y="510" width="1060" height="240" class="zone" />
    <text x="90" y="530" class="note" font-weight="bold">Shared packages (monorepo)</text>
    <rect x="100" y="548" width="140" height="46" class="fe" /><text x="170" y="576" class="lbl">ui</text>
    <rect x="280" y="548" width="140" height="46" class="fe" /><text x="350" y="576" class="lbl">i18n</text>
    <rect x="460" y="548" width="140" height="46" class="fe" /><text x="530" y="576" class="lbl">config</text>
    <rect x="660" y="548" width="140" height="46" class="fe" /><text x="730" y="576" class="lbl">auth</text>
    <rect x="880" y="548" width="180" height="46" class="fe" /><text x="970" y="576" class="lbl">api-client</text>
    <rect x="660" y="670" width="140" height="46" class="fe" /><text x="730" y="698" class="lbl">http</text>
    <rect x="880" y="670" width="180" height="46" class="fe" /><text x="970" y="698" class="lbl">api-contracts</text>
    <path d="M730,594 L730,670" class="dep" />
    <path d="M930,594 L930,632 L770,632 L770,670" class="dep" />
    <path d="M1010,594 L1010,670" class="dep" />
    <path d="M230,456 L230,548" class="dep" />
    <path d="M600,456 L600,548" class="dep" />
    <path d="M970,456 L970,548" class="dep" />
    <text x="170" y="622" class="small" fill="#dc2626">ui must NOT depend on</text>
    <text x="170" y="637" class="small" fill="#dc2626">api-client / http</text>
  </g>
  </g>
</svg>
