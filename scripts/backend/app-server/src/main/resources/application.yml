server:
  port: 8080

spring:
  application:
    name: ptools-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

app:
  poc-mode: ${POC_MODE:true}
  session:
    ttl-days: ${SESSION_TTL_DAYS:30}
    cache-ttl-seconds: ${SESSION_CACHE_TTL_SECONDS:1800}
    cache-max-size: ${SESSION_CACHE_MAX_SIZE:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,tauri://localhost,https://tauri.localhost,http://tauri.localhost}
  cookie:
    secure: ${COOKIE_SECURE:true}

logging:
  level:
    root: INFO
    com.example.app: DEBUG
